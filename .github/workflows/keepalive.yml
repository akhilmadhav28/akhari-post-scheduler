# GitHub pauses scheduled workflows in a public repo after 60 days with no
# repository activity. This commits a timestamp once a month so the
# run-due-posts schedule never goes quiet.
name: Keepalive

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keepalive" && git push
